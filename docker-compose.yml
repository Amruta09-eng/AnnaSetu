version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annasetu_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      default:
        aliases:
          - annasetu-backend
          - backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_FILE=/app/data/annasetu.db
      - CORS_ORIGIN=*
    volumes:
      - annasetu_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: annasetu_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  annasetu_data:
    driver: local
