version: '3.8'

services:
  annasetu-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annasetu_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_FILE=/app/data/annasetu.db
      - CORS_ORIGIN=*
    volumes:
      - annasetu_data:/app/data

volumes:
  annasetu_data:
    driver: local
